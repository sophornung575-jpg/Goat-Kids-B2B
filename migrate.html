<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Migrate Products - Goat Kids</title>
<script src="https://unpkg.com/firebase@10.7.1/firebase-app-compat.js"></script>
<script src="https://unpkg.com/firebase@10.7.1/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#f7fafc;padding:2rem;color:#2d3748}
.card{background:#fff;border-radius:12px;padding:1.5rem;max-width:600px;margin:0 auto;box-shadow:0 2px 12px rgba(0,0,0,.1)}
h1{font-size:1.3rem;margin-bottom:.5rem;color:#2d3748}
p{color:#718096;font-size:.88rem;margin-bottom:1.25rem}
.btn{padding:.75rem 1.5rem;background:#667eea;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.95rem;font-weight:700;width:100%}
.btn:hover{background:#5a67d8}
.btn:disabled{background:#e2e8f0;color:#a0aec0;cursor:not-allowed}
.btn-success{background:#48bb78}
.log{margin-top:1rem;background:#f7fafc;border:1px solid #e2e8f0;border-radius:8px;padding:1rem;font-size:.82rem;font-family:monospace;max-height:300px;overflow-y:auto;line-height:1.6}
.ok{color:#276749}.err{color:#c53030}.info{color:#2b6cb0}.warn{color:#744210}
.progress{background:#e2e8f0;border-radius:2rem;height:8px;margin:.75rem 0;overflow:hidden}
.progress-bar{height:100%;background:#667eea;border-radius:2rem;transition:width .3s;width:0}
</style>
</head>
<body>
<div class="card">
  <h1>🔄 Migrate Products to goat-kids-b2b</h1>
  <p>This will copy all products from <b>goat-kids-store</b> (old) to <b>goat-kids-b2b</b> (new). Existing products in the new project will not be overwritten.</p>
  
  <div id="status" style="background:#ebedff;border-radius:8px;padding:.75rem;font-size:.85rem;margin-bottom:1rem;text-align:center">
    Ready to migrate
  </div>

  <div class="progress"><div class="progress-bar" id="progressBar"></div></div>

  <button class="btn" id="migrateBtn" onclick="startMigration()">
    Start Migration
  </button>

  <div class="log" id="log" style="display:none"></div>
</div>

<script>
// OLD project (source)
var oldApp = firebase.initializeApp({
  apiKey: "AIzaSyDBQyX-LC9dIzE-B-79kXBmr42KbWEoQSU",
  authDomain: "goat-kids-store.firebaseapp.com",
  projectId: "goat-kids-store",
  storageBucket: "goat-kids-store.firebasestorage.app",
  messagingSenderId: "372035223463",
  appId: "1:372035223463:web:a9948932607e81da2a4082"
}, "old");

// NEW project (destination)
var newApp = firebase.initializeApp({
  apiKey: "AIzaSyAiTcQDO0UGqWBzJn1DkoRrnXCJW2n83kM",
  authDomain: "goat-kids-b2b.firebaseapp.com",
  projectId: "goat-kids-b2b",
  storageBucket: "goat-kids-b2b.firebasestorage.app",
  messagingSenderId: "133821884669",
  appId: "1:133821884669:web:87626bd7c869b40981f694"
}, "new");

var oldDb = firebase.firestore(oldApp);
var newDb = firebase.firestore(newApp);

function log(msg, type) {
  var el = document.getElementById('log');
  el.style.display = 'block';
  el.innerHTML += '<div class="'+(type||'info')+'">'+msg+'</div>';
  el.scrollTop = el.scrollHeight;
}

function setStatus(msg, color) {
  var el = document.getElementById('status');
  el.textContent = msg;
  el.style.background = color || '#ebedff';
}

function setProgress(pct) {
  document.getElementById('progressBar').style.width = pct + '%';
}

async function startMigration() {
  var btn = document.getElementById('migrateBtn');
  btn.disabled = true;
  btn.textContent = 'Migrating...';
  setStatus('Connecting to old project...', '#ebedff');
  log('Connecting to goat-kids-store (old project)...');

  try {
    // Read all products from old project
    // Try the 'stores' collection structure
    var allProducts = [];

    // Try /stores collection
    log('Reading products from old project...');
    var storesSnap = await oldDb.collection('stores').get();
    log('Found ' + storesSnap.size + ' store(s) in old project', 'info');

    for (var i = 0; i < storesSnap.docs.length; i++) {
      var storeDoc = storesSnap.docs[i];
      // Try subcollection products
      var prodsSnap = await oldDb.collection('stores').doc(storeDoc.id).collection('products').get();
      if (prodsSnap.size > 0) {
        log('Store ' + storeDoc.id + ': found ' + prodsSnap.size + ' products in subcollection', 'ok');
        prodsSnap.docs.forEach(function(d) {
          allProducts.push(Object.assign({id: d.id, _storeId: storeDoc.id}, d.data()));
        });
      }
      // Also check if products are in the store document itself
      var storeData = storeDoc.data();
      if (storeData.products && Array.isArray(storeData.products)) {
        log('Store ' + storeDoc.id + ': found ' + storeData.products.length + ' products in document', 'ok');
        storeData.products.forEach(function(p) {
          allProducts.push(Object.assign({_storeId: storeDoc.id}, p));
        });
      }
    }

    // Also try direct products collection
    try {
      var directProds = await oldDb.collection('products').get();
      if (directProds.size > 0) {
        log('Found ' + directProds.size + ' products in /products collection', 'ok');
        directProds.docs.forEach(function(d) {
          allProducts.push(Object.assign({id: d.id}, d.data()));
        });
      }
    } catch(e) {}

    if (allProducts.length === 0) {
      log('No products found! Checking localStorage structure...', 'warn');
      setStatus('No products found in old project', '#fed7d7');
      btn.disabled = false;
      btn.textContent = 'Try Again';
      return;
    }

    log('Total products to migrate: ' + allProducts.length, 'info');
    setStatus('Migrating ' + allProducts.length + ' products...', '#ebedff');

    // Write to new project
    var success = 0, skip = 0, fail = 0;
    for (var j = 0; j < allProducts.length; j++) {
      var p = allProducts[j];
      setProgress(Math.round((j / allProducts.length) * 100));
      try {
        // Check if product already exists by name
        var existing = await newDb.collection('stores').doc('main').collection('products')
          .where('name', '==', p.name).limit(1).get();
        if (!existing.empty) {
          log('Skip (exists): ' + p.name, 'warn');
          skip++;
          continue;
        }
        // Copy to new project
        var newProd = Object.assign({}, p);
        delete newProd.id;
        delete newProd._storeId;
        newProd.migratedAt = firebase.firestore.FieldValue.serverTimestamp();
        await newDb.collection('stores').doc('main').collection('products').add(newProd);
        log('Copied: ' + p.name, 'ok');
        success++;
      } catch(e) {
        log('Failed: ' + (p.name||'unknown') + ' - ' + e.message, 'err');
        fail++;
      }
    }

    setProgress(100);
    setStatus('Done! Copied: ' + success + ' | Skipped: ' + skip + ' | Failed: ' + fail,
      fail > 0 ? '#fed7d7' : '#c6f6d5');
    log('--- Migration complete ---', 'ok');
    log('Copied: ' + success + ' | Skipped: ' + skip + ' | Failed: ' + fail, 'info');
    btn.textContent = 'Migration Complete!';
    btn.className = 'btn btn-success';

  } catch(e) {
    log('Error: ' + e.message, 'err');
    setStatus('Migration failed: ' + e.message, '#fed7d7');
    btn.disabled = false;
    btn.textContent = 'Try Again';
  }
}
</script>
</body>
</html>
